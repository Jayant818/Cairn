[package]
name = "cairn"
version = "0.1.0"
description = "Token-2022 equity lending markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cairn"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
pyth-solana-receiver-sdk = "1.2.0"

[dev-dependencies]
proptest = "1.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
